.brand{
  width:min(92vw,760px); margin:0 auto; display:block;
  filter:drop-shadow(0 0 12px rgba(255,39,215,.55)) drop-shadow(0 0 28px rgba(0,234,255,.2));

}

}
.number b{color:#fff;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{
  padding:22px 16px 10px; max-width:980px; margin:auto;
}
.offer{
  position:relative; overflow:hidden; border-radius:26px; padding:22px 18px; text-align:center;
  background:linear-gradient(100deg,#7b2cff,#d526ff,#ff2ab4);
  box-shadow:0 0 35px rgba(176,42,255,.35), inset 0 1px rgba(255,255,255,.25);
  animation:pulse 3s ease-in-out infinite;
}
.offer:after{
  content:""; position:absolute; top:-50%; left:-20%; width:30%; height:220%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);
  transform:rotate(18deg); animation:shine 3.5s linear infinite;
}
@keyframes shine{to{left:120%}}
@keyframes pulse{50%{transform:translateY(-2px);box-shadow:0 0 48px rgba(255,39,215,.5),inset 0 1px rgba(255,255,255,.25)}}
.offer strong{display:block;font-size:clamp(25px,6vw,42px)}
.offer span{font-size:clamp(16px,4vw,24px);font-weight:800}
.section-title{text-align:center;font-size:28px;margin:30px 0 16px}
.section-title span{color:var(--cyan)}
.grid{
  width:min(980px,calc(100% - 24px)); margin:0 auto 120px;
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;
}
.card{
  position:relative; overflow:hidden; border-radius:24px; padding:10px;
  background:linear-gradient(145deg,rgba(25,28,52,.96),rgba(10,11,25,.96));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 30px rgba(0,0,0,.35); transform:translateY(24px); opacity:0;
  animation:cardIn .65s cubic-bezier(.2,.8,.2,1) forwards;
}
.card:nth-child(2n){animation-delay:.08s}.card:nth-child(3n){animation-delay:.15s}
@keyframes cardIn{to{opacity:1;transform:none}}
.card:before{
  content:"";position:absolute;inset:-2px;border-radius:26px;
  background:conic-gradient(from var(--angle),#ff27d7,#7b2cff,#00eaff,#b8ff27,#ff27d7);
  z-index:-1;filter:blur(9px);opacity:.5;animation:spin 5s linear infinite;
}
@keyframes spin{to{--angle:360deg}}
.card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 0 32px rgba(255,39,215,.2)}
.product-image{
  aspect-ratio:245/292; width:100%; object-fit:cover; border-radius:18px; display:block;
  background:#171a2c; transition:transform .45s ease,filter .45s ease;
}
.card:hover .product-image{transform:scale(1.04);filter:saturate(1.15)}
.info{padding:12px 4px 4px}
.no{font-size:12px;font-weight:1000;letter-spacing:.15em;color:#7defff}
.name{font-size:18px;font-weight:950;line-height:1.05;margin:5px 0 8px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-size:20px;font-weight:1000}
.add{
  border:0;color:#fff;font-weight:950;cursor:pointer;padding:11px 12px;border-radius:14px;
  background:linear-gradient(100deg,var(--violet),var(--pink)); box-shadow:0 7px 18px rgba(190,39,255,.28);
}
.add:active{transform:scale(.96)}
.cart{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
  border:1px solid rgba(255,255,255,.18);border-radius:20px;
  background:rgba(12,13,28,.9);backdrop-filter:blur(18px);
  box-shadow:0 10px 35px rgba(0,0,0,.5);
}
.cart-count{font-weight:1000}.cart-total{color:#fff;font-weight:900}
.cart-btn{
  border:0;color:#fff;font-weight:1000;padding:12px 15px;border-radius:14px;
  background:linear-gradient(90deg,#00aaff,#7b2cff,#ff27d7);cursor:pointer;
}
.sheet{
  position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end;
}
.sheet.open{display:flex}
.sheet-box{
  width:100%;max-height:82vh;overflow:auto;background:#0d0f20;border-radius:26px 26px 0 0;
  border-top:1px solid rgba(255,255,255,.16);padding:18px;
}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:#242740;color:#fff;border-radius:12px;padding:10px 13px;font-size:18px}
.row{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#252942;color:#fff;border-radius:8px;width:30px;height:30px}
.checkout{
  width:100%;border:0;border-radius:15px;padding:15px;color:#fff;font-size:16px;font-weight:1000;
  background:linear-gradient(90deg,#00aaff,#7b2cff,#ff27d7);margin-top:16px;
}
.empty{color:var(--muted);text-align:center;padding:25px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{padding:12px}}
</style>
</head>

const cart = {};
const price = 20;

document.getElementById("products").innerHTML = products.map(([no,name,img])=>`
  <article class="card">
    <img class="product-image" src="${img}" alt="${name}">
    <div class="info">
      <div class="no">N° ${no}</div>
      <div class="name">${name}</div>
      <div class="meta">
        <div class="price">20 €</div>
        <button class="add" onclick="addToCart('${no}')">+ Panier</button>
      </div>
    </div>
  </article>
`).join("");

function addToCart(no){
  cart[no]=(cart[no]||0)+1;
  updateCart();
}
function removeFromCart(no){
  if(!cart[no]) return;
  cart[no]--;
  if(cart[no]<=0) delete cart[no];
  updateCart();
}
function cartCount(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function calcTotal(){
  const q=cartCount();
  if(q>=3){
    const packs=Math.floor(q/3), rest=q%3;
    return packs*55+rest*20;
  }
  return q*20;
}
function updateCart(){
  document.getElementById("count").textContent=cartCount();
  document.getElementById("total").textContent=calcTotal()+" €";
  renderCart();
}
function renderCart(){
  const rows=document.getElementById("cartRows");
  if(!cartCount()){
    rows.innerHTML='<div class="empty">Ton panier est vide 😎<br>Choisis tes goûts ci-dessus.</div>';
    document.getElementById("cartSummary").innerHTML="";
    return;
  }
  rows.innerHTML=Object.entries(cart).map(([no,q])=>{
    const p=products.find(x=>x[0]===no);
    return `<div class="row"><div><b>${p[1]}</b><br><small>20 € l'unité</small></div>
      <div class="qty"><button onclick="removeFromCart('${no}')">−</button><b>${q}</b><button onclick="addToCart('${no}')">+</button></div></div>`;
  }).join("");
  const q=cartCount(), total=calcTotal();
  document.getElementById("cartSummary").innerHTML=
    `<p><b>${q} boisson(s)</b> — Total : <b>${total} €</b>${q>=3?' 🔥 Offre 3 = 55 € appliquée':''}</p>`;
}
function openCart(){document.getElementById("sheet").classList.add("open");renderCart()}
function closeCart(){document.getElementById("sheet").classList.remove("open")}
function sendOrder(){
  if(!cartCount()) return;
  const lines=Object.entries(cart).map(([no,q])=>{
    const p=products.find(x=>x[0]===no);
    return `${q} x ${p[1]} (N°${no})`;
  });
  const message=`🛍️ COMMANDE RAZZ BAR\\n\\n${lines.join("\\n")}\\n\\n💶 Total : ${calcTotal()} €`;
  if(tg && tg.sendData){
    tg.sendData(JSON.stringify({type:"order",message,cart,total:calcTotal()}));
    tg.close();
  } else {
    navigator.clipboard?.writeText(message);
    alert("Commande préparée. Dans Telegram, elle sera envoyée au bot.");
  }
}
updateCart();
</script>
